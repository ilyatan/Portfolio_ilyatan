<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=2">
  <link rel="shortcut icon" href="images/favicon.svg?v=2">
  <link rel="alternate icon" type="image/png" href="images/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ilya Tan — UI|UX Designer specializing in Mobile Applications, SaaS, and B2B Systems">
  <title>Ilya Tan — UI|UX Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Prevent flash of wrong theme
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="js/main.js"></script>
</body>
</html>
